<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@600&display=swap" />
  <script src="/public/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    #frame {
      width: 1920px; height: 1080px;
      container-type: size;
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
    }
    .clip {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #bg { background: #FFFFFF; }
    #content {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 3cqw 3.6cqw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5cqw;
    }
    #nota-header {
      display: flex;
      align-items: center;
      gap: 1cqw;
      opacity: 0;
    }
    #nota-icon {
      font-size: 3.5cqw;
      line-height: 1;
    }
    #nota-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #E8000E;
    }
    .card {
      border-left: 4px solid #E8000E;
      padding-left: 1.2cqw;
      opacity: 0;
    }
    .card-title {
      font-family: 'Shrikhand', cursive;
      font-size: 3.3cqw;
      line-height: 1.0;
      color: #1A1A1A;
    }
    .card-body {
      font-family: 'Libre Baskerville', serif;
      font-size: 0.85cqw;
      line-height: 1.75;
      color: #1A1A1A;
      margin-top: 0.4cqw;
    }
    #progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 0.5cqw;
      background: #E8000E;
      width: 0%;
    }
  </style>
</head>
<body>
  <div id="frame" data-composition-id="04-arbitragem" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <div id="bg" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
    <div id="content" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div id="nota-header">
        <span id="nota-icon">⚠</span>
        <span id="nota-label">Nota Oficial</span>
      </div>
      <div class="card" id="card1">
        <div class="card-title">Críticas à arbitragem</div>
        <div class="card-body">Após derrota para o Santos (09/10), o clube emitiu nota<br>criticando a arbitragem brasileira.</div>
      </div>
      <div class="card" id="card2">
        <div class="card-title">Recorde de fraturas em 2026</div>
        <div class="card-body">Flamengo denunciou "praticamente uma fratura por mês" —<br>recorde nos quadros clínicos do clube.</div>
      </div>
    </div>
    <div id="progress" class="clip" data-start="0" data-duration="8" data-track-index="2"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to("#nota-header", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.3)
      .fromTo("#card1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.5)
      .fromTo("#card2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.0)
      .to("#progress", { width: "100%", duration: 8, ease: "none" }, 0);

    window.__timelines["04-arbitragem"] = tl;
  </script>
</body>
</html>
