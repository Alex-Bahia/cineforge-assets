<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@600&display=swap" />
  <script src="/public/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    #frame {
      width: 1920px; height: 1080px;
      container-type: size;
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
    }
    .clip {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #bg { background: #FFFFFF; }
    #content {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 3cqw 3.6cqw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.8cqw;
    }
    #eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #E8000E;
      opacity: 0;
    }
    #lider-block {
      display: flex;
      align-items: center;
      gap: 3cqw;
      opacity: 0;
    }
    #trophy-label {
      display: flex;
      flex-direction: column;
      gap: 0.3cqw;
    }
    #trophy-icon {
      font-size: 5cqw;
      line-height: 1;
    }
    #lider-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #1A1A1A;
    }
    #pts-number {
      font-family: 'Shrikhand', cursive;
      font-size: 22cqw;
      line-height: 0.82;
      color: #E8000E;
      transform: rotate(-6deg);
    }
    #pts-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2cqw;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1A1A1A;
      align-self: flex-end;
      margin-bottom: 1cqw;
    }
    #result-block {
      border-left: 4px solid #E8000E;
      padding-left: 1.2cqw;
      opacity: 0;
    }
    #result-title {
      font-family: 'Shrikhand', cursive;
      font-size: 3.3cqw;
      line-height: 1.0;
      color: #1A1A1A;
    }
    #result-sub {
      font-family: 'Libre Baskerville', serif;
      font-size: 0.85cqw;
      line-height: 1.75;
      color: #1A1A1A;
      margin-top: 0.4cqw;
    }
    #proximo-block {
      opacity: 0;
    }
    #proximo-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #E8000E;
    }
    #proximo-text {
      font-family: 'Shrikhand', cursive;
      font-size: 3.3cqw;
      color: #1A1A1A;
    }
    #progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 0.5cqw;
      background: #E8000E;
      width: 0%;
    }
  </style>
</head>
<body>
  <div id="frame" data-composition-id="02-brasileirao" data-start="0" data-duration="12" data-width="1920" data-height="1080">
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    <div id="content" class="clip" data-start="0" data-duration="12" data-track-index="1">
      <div id="eyebrow">Brasileirão 2026</div>
      <div id="lider-block">
        <div id="trophy-label">
          <div id="lider-text">🏆 Líder</div>
        </div>
        <div id="pts-number">64</div>
        <div id="pts-label">PTS</div>
      </div>
      <div id="result-block">
        <div id="result-title">FLA 1 × 0 FLU — Maracanã</div>
        <div id="result-sub">Clássico Fla-Flu · 13/10/2026 · Manteve a liderança</div>
      </div>
      <div id="proximo-block">
        <div id="proximo-label">Próximo jogo</div>
        <div id="proximo-text">vs Bahia — Qui 15/10 · 21h30</div>
      </div>
    </div>
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to("#eyebrow", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.3)
      .to("#lider-block", { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.0)
      .fromTo("#result-block", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.5)
      .fromTo("#proximo-block", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 7.5)
      .to("#progress", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["02-brasileirao"] = tl;
  </script>
</body>
</html>
