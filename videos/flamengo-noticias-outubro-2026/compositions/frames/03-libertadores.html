<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Libre+Baskerville:wght@400&family=Space+Grotesk:wght@600&display=swap" />
  <script src="/public/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    #frame {
      width: 1920px; height: 1080px;
      container-type: size;
      position: relative;
      overflow: hidden;
      background: #1A1A1A;
    }
    .clip {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #bg { background: #1A1A1A; }
    #content {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 3cqw 3.6cqw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5cqw;
    }
    #header-row {
      display: flex;
      align-items: center;
      gap: 2cqw;
      opacity: 0;
    }
    #lib-eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    #semi-badge {
      background: #E8000E;
      color: #FFFFFF;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2cqw;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.4cqw 1cqw;
    }
    #match-block {
      opacity: 0;
    }
    #match-title {
      font-family: 'Shrikhand', cursive;
      font-size: 10.4cqw;
      line-height: 0.9;
      color: #FFFFFF;
    }
    #match-sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4cqw;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #E8000E;
      margin-top: 0.8cqw;
    }
    #question {
      font-family: 'Shrikhand', cursive;
      font-size: 13.5cqw;
      line-height: 0.85;
      color: #E8000E;
      transform: rotate(-4deg);
      text-shadow: 2px 2px 0 rgba(28,20,16,.25), 4px 4px 0 rgba(28,20,16,.2), 6px 6px 0 rgba(28,20,16,.15);
      opacity: 0;
      margin-left: -2cqw;
    }
    #progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 0.5cqw;
      background: #E8000E;
      width: 0%;
    }
  </style>
</head>
<body>
  <div id="frame" data-composition-id="03-libertadores" data-start="0" data-duration="12" data-width="1920" data-height="1080">
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    <div id="content" class="clip" data-start="0" data-duration="12" data-track-index="1">
      <div id="header-row">
        <span id="lib-eyebrow">Libertadores 2026</span>
        <span id="semi-badge">Semifinal</span>
      </div>
      <div id="match-block">
        <div id="match-title">FLAMENGO × ESTUDIANTES</div>
        <div id="match-sub">La Plata — Argentina</div>
      </div>
      <div id="question">RUMO À FINAL?</div>
    </div>
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to("#header-row", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3)
      .fromTo("#match-block", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.0)
      .to("#question", { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.5)
      .to("#progress", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["03-libertadores"] = tl;
  </script>
</body>
</html>
