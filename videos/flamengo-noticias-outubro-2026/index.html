<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="/public/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1A1A1A;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .clip {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-hook"
        class="clip"
        data-start="0"
        data-duration="5"
        data-composition-id="scene-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-track-index="0"
      ></div>

      <div
        id="scene-brasileirao"
        class="clip"
        data-start="5"
        data-duration="12"
        data-composition-id="scene-brasileirao"
        data-composition-src="compositions/frames/02-brasileirao.html"
        data-track-index="1"
      ></div>

      <div
        id="scene-libertadores"
        class="clip"
        data-start="17"
        data-duration="12"
        data-composition-id="scene-libertadores"
        data-composition-src="compositions/frames/03-libertadores.html"
        data-track-index="2"
      ></div>

      <div
        id="scene-arbitragem"
        class="clip"
        data-start="29"
        data-duration="8"
        data-composition-id="scene-arbitragem"
        data-composition-src="compositions/frames/04-arbitragem.html"
        data-track-index="3"
      ></div>

      <div
        id="scene-encerramento"
        class="clip"
        data-start="37"
        data-duration="6"
        data-composition-id="scene-encerramento"
        data-composition-src="compositions/frames/05-encerramento.html"
        data-track-index="4"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
