<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1920,height=1080"/>
  <title>Frame 09 — Diamond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #030303;
      font-family: 'Lato', sans-serif;
    }

    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030303;
    }

    /* radial gemological glow behind everything */
    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 600px at 50% 42%,
          rgba(90,60,160,0.22) 0%,
          rgba(50,30,120,0.14) 40%,
          transparent 70%),
        radial-gradient(ellipse 600px 400px at 50% 42%,
          rgba(140,100,220,0.18) 0%,
          transparent 60%);
      opacity: 0;
    }

    /* ── Diamond container ──────────────────────────────────── */
    .diamond-wrap {
      position: relative;
      width: 520px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transform: scale(0.2);
      opacity: 0;
      flex-shrink: 0;
      /* push up a bit to make room for text */
      margin-top: -40px;
    }

    /* golden halo behind gem */
    .diamond-halo {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(212,175,55,0.25) 0%,
        rgba(184,134,11,0.12) 30%,
        transparent 65%
      );
      filter: blur(18px);
    }

    /* dispersion rays container */
    .rays-svg {
      position: absolute;
      width: 700px;
      height: 700px;
      opacity: 0;
    }

    /* main diamond SVG */
    .diamond-svg {
      position: relative;
      z-index: 2;
      width: 460px;
      height: 460px;
      /* subtle overall diamond glow */
      filter: drop-shadow(0 0 14px rgba(212,175,55,0.45))
              drop-shadow(0 0 35px rgba(160,130,220,0.3));
    }

    /* ── Facet sparkle animations ────────────────────────────── */
    @keyframes sparkle1 {
      0%, 100%  { opacity: 0.72; fill: url(#f1g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle2 {
      0%, 100%  { opacity: 0.65; fill: url(#f2g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle3 {
      0%, 100%  { opacity: 0.78; fill: url(#f3g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle4 {
      0%, 100%  { opacity: 0.60; fill: url(#f4g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle5 {
      0%, 100%  { opacity: 0.82; fill: url(#f5g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle6 {
      0%, 100%  { opacity: 0.68; fill: url(#f6g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle7 {
      0%, 100%  { opacity: 0.75; fill: url(#f7g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes sparkle8 {
      0%, 100%  { opacity: 0.70; fill: url(#f8g); }
      50%       { opacity: 1;    fill: url(#fWhite); }
    }
    @keyframes centerSparkle {
      0%, 100%  { opacity: 0.85; fill: url(#fc); }
      35%       { opacity: 1;    fill: url(#fWhite); }
    }

    .facet-upper { animation-fill-mode: backwards; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .facet-upper.sp1 { animation-name: sparkle1; animation-duration: 2.1s; animation-delay: 0.8s; }
    .facet-upper.sp2 { animation-name: sparkle2; animation-duration: 1.9s; animation-delay: 1.1s; }
    .facet-upper.sp3 { animation-name: sparkle3; animation-duration: 2.3s; animation-delay: 0.9s; }
    .facet-upper.sp4 { animation-name: sparkle4; animation-duration: 2.0s; animation-delay: 1.4s; }
    .facet-upper.sp5 { animation-name: sparkle5; animation-duration: 1.8s; animation-delay: 1.2s; }
    .facet-upper.sp6 { animation-name: sparkle6; animation-duration: 2.2s; animation-delay: 0.85s; }
    .facet-upper.sp7 { animation-name: sparkle7; animation-duration: 2.0s; animation-delay: 1.35s; }
    .facet-upper.sp8 { animation-name: sparkle8; animation-duration: 1.95s; animation-delay: 1.05s; }
    .facet-center   { animation-name: centerSparkle; animation-duration: 2.4s; animation-delay: 1.0s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; animation-fill-mode: backwards; }

    /* ── Text ────────────────────────────────────────────────── */
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 56px;
      line-height: 1.22;
      color: #F5F0E8;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      margin-top: 32px;
      flex-shrink: 0;
    }

    .headline em {
      font-style: italic;
      color: #D4AF37;
    }

    .caption {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: #D4AF37;
      text-align: center;
      margin-top: 22px;
      opacity: 0;
      flex-shrink: 0;
    }

    /* vignette */
    .frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="frame">

    <!-- Background glow -->
    <div class="bg-glow" id="bgGlow"></div>

    <!-- Diamond with halo + rays -->
    <div class="diamond-wrap" id="diamondWrap">
      <div class="diamond-halo"></div>

      <!-- Dispersion rays -->
      <svg class="rays-svg" id="raysSvg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rayGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rayWhite" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rayBlue" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#b0c8ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#b0c8ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rayRose" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffd6e0" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffd6e0" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rayViolet" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#d0b0ff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#d0b0ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rayCyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#90e8ff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#90e8ff" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- Rays radiating from center (350,350), each 200px long, various angles -->
        <!-- Angle 22°  -->
        <line id="ray1" x1="350" y1="350" x2="535" y2="279" stroke="url(#rayGold)"   stroke-width="2.5" stroke-linecap="round" opacity="0"/>
        <!-- Angle 75°  -->
        <line id="ray2" x1="350" y1="350" x2="402" y2="157" stroke="url(#rayWhite)"  stroke-width="2"   stroke-linecap="round" opacity="0"/>
        <!-- Angle 135° -->
        <line id="ray3" x1="350" y1="350" x2="209" y2="209" stroke="url(#rayBlue)"   stroke-width="2.5" stroke-linecap="round" opacity="0"/>
        <!-- Angle 195° -->
        <line id="ray4" x1="350" y1="350" x2="157" y2="402" stroke="url(#rayRose)"   stroke-width="2"   stroke-linecap="round" opacity="0"/>
        <!-- Angle 255° -->
        <line id="ray5" x1="350" y1="350" x2="165" y2="543" stroke="url(#rayViolet)" stroke-width="2.5" stroke-linecap="round" opacity="0"/>
        <!-- Angle 315° -->
        <line id="ray6" x1="350" y1="350" x2="491" y2="491" stroke="url(#rayCyan)"   stroke-width="2"   stroke-linecap="round" opacity="0"/>
        <!-- Angle 348° -->
        <line id="ray7" x1="350" y1="350" x2="546" y2="393" stroke="url(#rayGold)"   stroke-width="1.5" stroke-linecap="round" opacity="0"/>
        <!-- Angle 105° -->
        <line id="ray8" x1="350" y1="350" x2="298" y2="154" stroke="url(#rayRose)"   stroke-width="1.5" stroke-linecap="round" opacity="0"/>
      </svg>

      <!-- Brilliant-cut diamond SVG -->
      <!--
        Coordinates based on a 460×460 viewBox, center at (230,230).
        Girdle radius ≈ 200.  Table octagon radius ≈ 90. Crown facets connect them.
        Pavilion (lower half) facets go from girdle to culet at bottom.
      -->
      <svg class="diamond-svg" viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Flash white for sparkle keyframes -->
          <radialGradient id="fWhite" cx="50%" cy="40%" r="60%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.9"/>
          </radialGradient>

          <!-- Crown facet gradients: mixes of gold/white/blue/violet -->
          <linearGradient id="f1g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.9"/>
            <stop offset="60%"  stop-color="#fff8dc" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#e8e0ff" stop-opacity="0.5"/>
          </linearGradient>
          <linearGradient id="f2g" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#c8d8ff" stop-opacity="0.8"/>
            <stop offset="50%"  stop-color="#ffffff"  stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#D4AF37"  stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="f3g" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#d0b0ff" stop-opacity="0.7"/>
            <stop offset="60%"  stop-color="#ffffff"  stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffd6e0"  stop-opacity="0.5"/>
          </linearGradient>
          <linearGradient id="f4g" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%"   stop-color="#B8860B" stop-opacity="0.75"/>
            <stop offset="50%"  stop-color="#fffacd" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#b0e8ff" stop-opacity="0.55"/>
          </linearGradient>
          <linearGradient id="f5g" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.95"/>
            <stop offset="60%"  stop-color="#D4AF37"  stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#c8d0ff"  stop-opacity="0.4"/>
          </linearGradient>
          <linearGradient id="f6g" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%"   stop-color="#ffd6e0"  stop-opacity="0.65"/>
            <stop offset="50%"  stop-color="#ffffff"   stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#D4AF37"   stop-opacity="0.7"/>
          </linearGradient>
          <linearGradient id="f7g" x1="20%" y1="80%" x2="80%" y2="20%">
            <stop offset="0%"   stop-color="#90d8ff" stop-opacity="0.65"/>
            <stop offset="50%"  stop-color="#ffffff"  stop-opacity="0.88"/>
            <stop offset="100%" stop-color="#D4AF37"  stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="f8g" x1="80%" y1="80%" x2="20%" y2="20%">
            <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.8"/>
            <stop offset="50%"  stop-color="#fffacd" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#d0b0ff" stop-opacity="0.5"/>
          </linearGradient>

          <!-- Center table octagon gradient -->
          <radialGradient id="fc" cx="50%" cy="45%" r="65%">
            <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.98"/>
            <stop offset="30%"  stop-color="#fff8dc"  stop-opacity="0.9"/>
            <stop offset="70%"  stop-color="#D4AF37"  stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#B8860B"  stop-opacity="0.5"/>
          </radialGradient>

          <!-- Girdle stroke -->
          <linearGradient id="girdleG" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.9"/>
            <stop offset="50%"  stop-color="#ffffff"  stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.9"/>
          </linearGradient>

          <!-- Pavilion facet gradients (lower half) -->
          <linearGradient id="pv1" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#0a0a1a"  stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="pv2" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#c8d0ff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#050510"  stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="pv3" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#050515"  stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="pv4" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#d0b0ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#030308"  stop-opacity="0.95"/>
          </linearGradient>
        </defs>

        <!-- ── Girdle (outer octagon) ── -->
        <!-- 8 points at angles 22.5°, 67.5°, 112.5°, 157.5°, 202.5°, 247.5°, 292.5°, 337.5° -->
        <!-- radius = 210, center = 230,230 -->
        <!--
          P0: 230+210*cos(22.5°), 230+210*sin(22.5°)   ≈ 424, 310
          P1: 230+210*cos(67.5°), 230+210*sin(67.5°)   ≈ 310, 424
          P2: 230+210*cos(112.5°), 230+210*sin(112.5°) ≈ 36, 424  → 36,424
          Wait, let me recalculate more carefully.

          Using precise coordinates for a regular octagon:
          r = 200, center = (230,230)
          angles from top going clockwise: 90°,45°,0°,315°,270°,225°,180°,135°
          → standard math angles (from +x axis, CCW):
            0°:   (230+200, 230)          = (430, 230)
            45°:  (230+141.4, 230-141.4)  = (371, 89)
            90°:  (230, 230-200)          = (230, 30)
            135°: (230-141.4, 230-141.4)  = (89, 89)
            180°: (230-200, 230)          = (30, 230)
            225°: (230-141.4, 230+141.4)  = (89, 371)
            270°: (230, 230+200)          = (230, 430)
            315°: (230+141.4, 230+141.4)  = (371, 371)
        -->
        <polygon
          points="430,230 371,89 230,30 89,89 30,230 89,371 230,430 371,371"
          fill="none"
          stroke="url(#girdleG)"
          stroke-width="1.5"
          opacity="0.7"
        />

        <!-- ── Pavilion (lower) facets — fill going to culet at (230,430) ── -->
        <!-- 8 triangular pavilion facets from each girdle edge to culet -->
        <polygon points="430,230 371,371 230,430" fill="url(#pv1)" opacity="0.85"/>
        <polygon points="371,371 230,430 89,371"  fill="url(#pv2)" opacity="0.75"/>
        <polygon points="89,371 230,430 30,230"   fill="url(#pv3)" opacity="0.8"/>
        <polygon points="30,230 89,371 89,89"     fill="url(#pv4)" opacity="0.65"/>
        <!-- upper pavilion facets (these meet at the girdle) -->
        <polygon points="89,89 230,30 89,371"     fill="url(#pv1)" opacity="0.5"/>
        <polygon points="89,89 230,30 371,89"     fill="url(#pv2)" opacity="0.55"/>
        <polygon points="430,230 371,89 371,371"  fill="url(#pv3)" opacity="0.6"/>
        <polygon points="230,30 371,89 430,230"   fill="url(#pv4)" opacity="0.5"/>

        <!-- Pavilion outline lines for sparkle edges -->
        <line x1="430" y1="230" x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
        <line x1="371" y1="89"  x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
        <line x1="230" y1="30"  x2="230" y2="430" stroke="rgba(212,175,55,0.25)" stroke-width="0.8"/>
        <line x1="89"  y1="89"  x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
        <line x1="30"  y1="230" x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
        <line x1="89"  y1="371" x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
        <line x1="371" y1="371" x2="230" y2="430" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>

        <!-- ── Crown facets (upper half, from girdle to table) ── -->
        <!--
          Table octagon (inner), radius = 90:
          T0: (320,230)  T1: (294,167)  T2: (230,140)  T3: (166,167)
          T4: (140,230)  T5: (166,293)  T6: (230,320)  T7: (294,293)
        -->
        <!-- 8 main kite/triangle crown facets -->
        <polygon class="facet-upper sp1" points="430,230 371,89  294,167 320,230" fill="url(#f1g)"/>
        <polygon class="facet-upper sp2" points="371,89  230,30  230,140 294,167" fill="url(#f2g)"/>
        <polygon class="facet-upper sp3" points="230,30  89,89   166,167 230,140" fill="url(#f3g)"/>
        <polygon class="facet-upper sp4" points="89,89   30,230  140,230 166,167" fill="url(#f4g)"/>
        <polygon class="facet-upper sp5" points="30,230  89,89   166,167 140,230" fill="url(#f5g)" opacity="0"/>
        <!-- Redefine bottom-left quadrant -->
        <polygon class="facet-upper sp5" points="30,230  89,371  166,293 140,230" fill="url(#f5g)"/>
        <polygon class="facet-upper sp6" points="89,371  230,430 230,320 166,293" fill="url(#f6g)"/>
        <polygon class="facet-upper sp7" points="230,430 371,371 294,293 230,320" fill="url(#f7g)"/>
        <polygon class="facet-upper sp8" points="371,371 430,230 320,230 294,293" fill="url(#f8g)"/>

        <!-- Crown facet edge lines -->
        <line x1="430" y1="230" x2="320" y2="230" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="371" y1="89"  x2="294" y2="167" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="230" y1="30"  x2="230" y2="140" stroke="rgba(255,255,255,0.3)"  stroke-width="0.7"/>
        <line x1="89"  y1="89"  x2="166" y2="167" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="30"  y1="230" x2="140" y2="230" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="89"  y1="371" x2="166" y2="293" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="230" y1="430" x2="230" y2="320" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line x1="371" y1="371" x2="294" y2="293" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>

        <!-- Table octagon (center facet) — sparkling brightest -->
        <polygon
          class="facet-center"
          points="320,230 294,167 230,140 166,167 140,230 166,293 230,320 294,293"
          fill="url(#fc)"
        />
        <!-- Table edge -->
        <polygon
          points="320,230 294,167 230,140 166,167 140,230 166,293 230,320 294,293"
          fill="none"
          stroke="rgba(255,255,255,0.4)"
          stroke-width="1"
        />

        <!-- Girdle outline on top -->
        <polygon
          points="430,230 371,89 230,30 89,89 30,230 89,371 230,430 371,371"
          fill="none"
          stroke="url(#girdleG)"
          stroke-width="2"
        />

        <!-- Star facet lines from table to crown -->
        <line x1="320" y1="230" x2="430" y2="230" stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="294" y1="167" x2="371" y2="89"  stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="230" y1="140" x2="230" y2="30"  stroke="rgba(255,248,200,0.18)" stroke-width="0.5"/>
        <line x1="166" y1="167" x2="89"  y2="89"  stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="140" y1="230" x2="30"  y2="230" stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="166" y1="293" x2="89"  y2="371" stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="230" y1="320" x2="230" y2="430" stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
        <line x1="294" y1="293" x2="371" y2="371" stroke="rgba(255,248,200,0.15)" stroke-width="0.5"/>
      </svg>

    </div><!-- .diamond-wrap -->

    <!-- Headline text -->
    <div class="headline" id="headline">
      Sua melhor negociação<br/>pode começar<br/><em>agora.</em>
    </div>

    <!-- Caption -->
    <div class="caption" id="caption">
      Diamantes certificados GIA e IGI &nbsp;·&nbsp; Alex Joias
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    window.__timelines["f09"] = tl;

    const bgGlow      = document.getElementById("bgGlow");
    const diamondWrap = document.getElementById("diamondWrap");
    const raysSvg     = document.getElementById("raysSvg");
    const headline    = document.getElementById("headline");
    const caption     = document.getElementById("caption");
    const rays        = [1,2,3,4,5,6,7,8].map(i => document.getElementById("ray"+i));

    // ── 1. Bg glow pulses in (0s) ──────────────────────────────
    tl.to(bgGlow, {
      opacity: 1,
      duration: 0.8, ease: "power2.out"
    }, 0);

    // subtle glow breathe
    tl.to(bgGlow, {
      opacity: 0.75,
      duration: 0.6, ease: "power1.inOut",
      yoyo: true, repeat: -1
    }, 0.8);

    // ── 2. Diamond scales in (0.2s) ────────────────────────────
    tl.to(diamondWrap, {
      scale: 1, opacity: 1,
      duration: 0.7, ease: "back.out(1.5)"
    }, 0.2);

    // ── 3. Text fades in (0.5s) ────────────────────────────────
    tl.to(headline, {
      opacity: 1, y: 0,
      duration: 0.6, ease: "power2.out"
    }, 0.5);

    // ── 4. Dispersion rays extend outward (0.6s) ───────────────
    tl.to(raysSvg, {
      opacity: 1,
      duration: 0.3, ease: "power1.out"
    }, 0.6);

    // Each ray animates from length 0 (we manipulate stroke-dasharray / opacity)
    rays.forEach((ray, i) => {
      tl.fromTo(ray,
        { opacity: 0, attr: { "stroke-dashoffset": 200, "stroke-dasharray": "200 200" } },
        { opacity: 1, attr: { "stroke-dashoffset": 0,   "stroke-dasharray": "200 200" },
          duration: 0.5, ease: "power2.out" },
        0.6 + i * 0.04
      );
    });

    // ── 5. Caption fades in (0.9s) ─────────────────────────────
    tl.to(caption, {
      opacity: 1,
      duration: 0.5, ease: "power2.out"
    }, 0.9);

    // ── 6. Subtle diamond float / rotation loop ─────────────────
    tl.to(diamondWrap, {
      y: -8,
      duration: 1.5, ease: "power1.inOut",
      yoyo: true, repeat: -1
    }, 1.0);

    // Auto-play
    tl.play();
  </script>
</body>
</html>
