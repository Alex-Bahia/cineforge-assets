<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920,height=1080"/>
  <title>Frame 02 — Rolex Dial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Lato', sans-serif;
    }

    /* ── Scene container ── */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ── Watch image — 3× zoom, centred on the dial area ── */
    .watch-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      /* push the image up so the dial face sits centre-frame */
      padding-bottom: -80px;
    }

    .watch-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 70%;
      transform-origin: center 70%;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* ── Dark vignette over the photo ── */
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 55% at 50% 55%,
          transparent 30%, rgba(10,10,10,0.55) 70%, rgba(10,10,10,0.92) 100%);
      pointer-events: none;
    }

    /* ── Halo ring ── */
    .halo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      pointer-events: none;
    }

    .halo-ring {
      width: 520px;
      height: 520px;
      border-radius: 50%;
      border: 2px solid rgba(184,134,11,0.45);
      box-shadow:
        0 0 20px 4px rgba(184,134,11,0.30),
        0 0 60px 12px rgba(184,134,11,0.15),
        inset 0 0 30px 4px rgba(212,175,55,0.08);
      animation: halo-pulse 2.8s ease-in-out infinite;
    }

    .halo-ring-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow:
        0 0 15px 3px rgba(212,175,55,0.20),
        inset 0 0 20px 2px rgba(212,175,55,0.06);
      animation: halo-pulse 2.8s ease-in-out infinite reverse;
    }

    @keyframes halo-pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.04); }
    }

    /* ── SVG light rays ── */
    .rays-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      width: 900px;
      height: 900px;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* ── Overlay gradient so rays blend nicely ── */
    .rays-blend {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 40% 40% at 50% 40%,
        rgba(184,134,11,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Text block ── */
    .text-block {
      position: absolute;
      bottom: 90px;
      left: 110px;
      max-width: 540px;
      opacity: 0;
      will-change: opacity, transform;
    }

    .eyebrow {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 15px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #B8860B;
      margin-bottom: 20px;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 56px;
      line-height: 1.18;
      color: #F5F0E8;
      text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    }

    .headline em {
      font-style: italic;
      color: #D4AF37;
    }

    /* ── Gold dust shimmer ── */
    .gold-dust {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, rgba(212,175,55,0.18) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 20%, rgba(212,175,55,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 65%, rgba(184,134,11,0.10) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(212,175,55,0.08) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, rgba(212,175,55,0.10) 0%, transparent 100%);
      pointer-events: none;
      animation: dust-shimmer 6s ease-in-out infinite alternate;
    }

    @keyframes dust-shimmer {
      0%   { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="scene" id="root" data-composition-id="f02">

    <!-- Watch photo -->
    <div class="watch-wrap">
      <img class="watch-img" src="../../public/watch-hero.webp" alt="Rolex watch dial"/>
    </div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Gold dust -->
    <div class="gold-dust"></div>

    <!-- SVG Light Rays -->
    <svg class="rays-svg" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Radial glow for centre -->
        <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.55"/>
          <stop offset="40%"  stop-color="#B8860B" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
        </radialGradient>
        <!-- Ray gradient -->
        <linearGradient id="rayGrad1" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
          <stop offset="0%"   stop-color="#D4AF37" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
        </linearGradient>
        <filter id="blur-soft">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
        <filter id="blur-heavy">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <!-- Centre glow -->
      <circle cx="450" cy="450" r="90" fill="url(#centreGlow)"/>
      <circle cx="450" cy="450" r="40" fill="#D4AF37" fill-opacity="0.18" filter="url(#blur-soft)"/>

      <!-- 16 rays, blurred, thin triangles emanating from centre -->
      <g id="raysGroup" transform-origin="450 450">
        <!-- Each ray: a thin triangle from centre outward -->
        <polygon points="450,450  430,0   470,0"   fill="#D4AF37" fill-opacity="0.22" filter="url(#blur-soft)"/>
        <polygon points="450,450  747,168 770,145" fill="#D4AF37" fill-opacity="0.18" filter="url(#blur-soft)"/>
        <polygon points="450,450  900,430 900,470" fill="#D4AF37" fill-opacity="0.22" filter="url(#blur-soft)"/>
        <polygon points="450,450  770,755 747,778" fill="#D4AF37" fill-opacity="0.18" filter="url(#blur-soft)"/>
        <polygon points="450,450  430,900 470,900" fill="#D4AF37" fill-opacity="0.22" filter="url(#blur-soft)"/>
        <polygon points="450,450  153,778 130,755" fill="#D4AF37" fill-opacity="0.18" filter="url(#blur-soft)"/>
        <polygon points="450,450  0,470    0,430"  fill="#D4AF37" fill-opacity="0.22" filter="url(#blur-soft)"/>
        <polygon points="450,450  130,145 153,122" fill="#D4AF37" fill-opacity="0.18" filter="url(#blur-soft)"/>
        <!-- Secondary mid rays, softer -->
        <polygon points="450,450  270,0   380,0"   fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  900,270 900,380" fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  900,620 900,730" fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  520,900 630,900" fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  270,900 380,900" fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  0,630    0,520"  fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  0,270    0,380"  fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
        <polygon points="450,450  620,0   730,0"   fill="#B8860B" fill-opacity="0.12" filter="url(#blur-heavy)"/>
      </g>
    </svg>

    <!-- Rays colour blend -->
    <div class="rays-blend"></div>

    <!-- Halo ring -->
    <div class="halo-wrap">
      <div class="halo-ring">
        <div class="halo-ring-inner"></div>
      </div>
    </div>

    <!-- Text -->
    <div class="text-block">
      <p class="eyebrow">Alex Joias · Copacabana</p>
      <h1 class="headline">
        No pulso,<br>
        cada segundo<br>
        ganha outro<br>
        <em>significado.</em>
      </h1>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    window.__timelines["f02"] = tl;

    const raysGroup = document.getElementById("raysGroup");

    tl
      // Watch fades in, scale from 3 → 2.85 (dial-area de-zoom)
      .fromTo(".watch-img", {
        opacity: 0,
        scale: 3,
        transformOrigin: "center 70%"
      }, {
        opacity: 1,
        scale: 2.85,
        transformOrigin: "center 70%",
        duration: 2.2,
        ease: "power2.out"
      }, 0)

      // Light rays fade in and slowly rotate
      .to(".rays-svg", {
        opacity: 1,
        duration: 0.8,
        ease: "power1.in"
      }, 0.15)

      // Continuous slow rotation of the rays group via GSAP repeat
      .to(raysGroup, {
        rotation: 18,
        transformOrigin: "450px 450px",
        duration: 2,
        ease: "none"
      }, 0)

      // Text slides up and fades in
      .fromTo(".text-block", {
        opacity: 0,
        y: 28
      }, {
        opacity: 1,
        y: 0,
        duration: 0.9,
        ease: "power3.out"
      }, 0.6);
  </script>
</body>
</html>
