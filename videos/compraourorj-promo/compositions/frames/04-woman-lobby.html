<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Frame 04 — Woman Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1A1A1A;
    }

    /* ── Background ── */
    #bg {
      position: absolute;
      inset: 0;
      background-image: url('../../public/gold-bg.webp');
      background-size: cover;
      background-position: center;
      filter: brightness(0.5) saturate(1.4);
      opacity: 0;
      will-change: opacity;
    }

    /* ── Shimmer sweep ── */
    #shimmer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
    }
    #shimmer::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -60%;
      width: 40%;
      height: 140%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255,255,220,0.08) 35%,
        rgba(255,255,200,0.22) 50%,
        rgba(255,255,220,0.08) 65%,
        transparent 100%
      );
      animation: shimmerSweep 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes shimmerSweep {
      0%   { transform: translateX(0); }
      100% { transform: translateX(600%); }
    }

    /* ── Bokeh layer ── */
    #bokeh {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ── Text block ── */
    #text-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      will-change: transform, opacity;
    }

    .eyebrow {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 22px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #D4AF37;
      margin-bottom: 28px;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 68px;
      line-height: 1.18;
      color: #F5F0E8;
      white-space: pre-line;
    }

    .headline em {
      font-style: italic;
      color: #D4AF37;
    }

    /* ── Logo ── */
    #logo {
      position: absolute;
      bottom: 54px;
      right: 64px;
      width: 200px;
      height: 200px;
      object-fit: contain;
      opacity: 0;
      will-change: opacity;
    }

    /* ── Dark vignette overlay ── */
    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }
  </style>
</head>

  <!-- Vignette -->

  <!-- Text -->

    <p class="eyebrow">Alex Joias · 41 Anos de Tradição</p>
    <h1 class="headline">Uma seleção
para quem reconhece
qualidade em cada
<em>detalhe.</em></h1>

  <!-- Logo -->
  <img id="logo" src="../../public/logo-maison.webp" alt="Alex Joias" />

  </div><!-- /data-composition-id="f04" -->

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    window.__timelines["f04"] = tl;

    const bg       = document.getElementById('bg');
    const shimmer  = document.getElementById('shimmer');
    const textBlock= document.getElementById('text-block');
    const logo     = document.getElementById('logo');

    // 0s — bg fades in
    tl.to(bg, { opacity: 1, duration: 0.7, ease: 'power2.out' }, 0);

    // 0.2s — shimmer visible
    tl.to(shimmer, { opacity: 1, duration: 0.3, ease: 'none' }, 0.2);

    // 0.4s — text slides in from left
    tl.fromTo(textBlock,
      { x: -80, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.7, ease: 'power3.out' },
      0.4
    );

    // 0.8s — logo fades in
    tl.to(logo, { opacity: 0.9, duration: 0.5, ease: 'power2.out' }, 0.8);
  </script>
