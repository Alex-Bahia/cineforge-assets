<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920,height=1080"/>
  <title>Frame 03 — Gloves Rolex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0c0b09;
      font-family: 'Lato', sans-serif;
    }

    /* ── Scene ── */
    .scene {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ── Background gold dust shimmer ── */
    .bg-shimmer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 120% at 50% 50%,
          rgba(30,25,10,1) 0%,
          rgba(14,12,5,1)  55%,
          #0c0b09 100%),
        /* tiny scattered gold specks via layered radials */
        radial-gradient(1.5px 1.5px at 8%  12%,  rgba(212,175,55,0.30) 0%, transparent 100%),
        radial-gradient(1px   1px   at 18% 72%,  rgba(212,175,55,0.20) 0%, transparent 100%),
        radial-gradient(2px   2px   at 32% 45%,  rgba(184,134,11,0.18) 0%, transparent 100%),
        radial-gradient(1px   1px   at 47% 88%,  rgba(212,175,55,0.22) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 61% 25%,  rgba(212,175,55,0.18) 0%, transparent 100%),
        radial-gradient(1px   1px   at 78% 60%,  rgba(184,134,11,0.20) 0%, transparent 100%),
        radial-gradient(2px   2px   at 88% 15%,  rgba(212,175,55,0.16) 0%, transparent 100%),
        radial-gradient(1px   1px   at 93% 82%,  rgba(212,175,55,0.14) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 55%,  rgba(212,175,55,0.12) 0%, transparent 100%),
        radial-gradient(1px   1px   at 25% 90%,  rgba(184,134,11,0.18) 0%, transparent 100%);
      animation: shimmer-drift 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes shimmer-drift {
      0%   { opacity: 0.55; background-position: 0 0; }
      100% { opacity: 1.00; background-position: 4px 6px; }
    }

    /* ── Watch image ── */
    .watch-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watch-img {
      width: 820px;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      transform: rotate(-5deg) translateY(30px);
      opacity: 0;
      will-change: transform, opacity;
      /* Golden rim-light glow using layered box-shadow */
      box-shadow:
        0 0 0 1px rgba(212,175,55,0.18),
        0 0 20px 4px  rgba(212,175,55,0.35),
        0 0 50px 12px rgba(184,134,11,0.28),
        0 0 100px 30px rgba(184,134,11,0.16),
        0 0 200px 60px rgba(184,134,11,0.08),
        /* warm fill light from top-right */
        inset 0 0 60px 0 rgba(212,175,55,0.05);
    }

    /* ── Vignette ── */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 68% 68% at 50% 50%,
        transparent 25%,
        rgba(10,9,6,0.45) 60%,
        rgba(10,9,6,0.90) 100%
      );
      pointer-events: none;
    }

    /* ── Particles ── */
    .particle {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Each particle is individually positioned and animated via CSS */
    .particle:nth-child(1)  { width:3px;  height:3px;  background:rgba(212,175,55,0.75); left:12%;  top:80%; animation: float-up 6.2s 0.0s ease-in-out infinite; }
    .particle:nth-child(2)  { width:2px;  height:2px;  background:rgba(212,175,55,0.55); left:22%;  top:85%; animation: float-up 7.1s 0.8s ease-in-out infinite; }
    .particle:nth-child(3)  { width:4px;  height:4px;  background:rgba(184,134,11,0.65); left:35%;  top:90%; animation: float-up 5.8s 1.4s ease-in-out infinite; }
    .particle:nth-child(4)  { width:2px;  height:2px;  background:rgba(212,175,55,0.45); left:48%;  top:82%; animation: float-up 8.0s 0.3s ease-in-out infinite; }
    .particle:nth-child(5)  { width:3px;  height:3px;  background:rgba(212,175,55,0.60); left:58%;  top:88%; animation: float-up 6.5s 1.9s ease-in-out infinite; }
    .particle:nth-child(6)  { width:2px;  height:2px;  background:rgba(184,134,11,0.50); left:68%;  top:84%; animation: float-up 7.4s 0.6s ease-in-out infinite; }
    .particle:nth-child(7)  { width:4px;  height:4px;  background:rgba(212,175,55,0.70); left:78%;  top:91%; animation: float-up 5.6s 2.2s ease-in-out infinite; }
    .particle:nth-child(8)  { width:2px;  height:2px;  background:rgba(212,175,55,0.40); left:88%;  top:86%; animation: float-up 6.9s 1.1s ease-in-out infinite; }
    .particle:nth-child(9)  { width:3px;  height:3px;  background:rgba(184,134,11,0.55); left:5%;   top:75%; animation: float-up 7.7s 0.5s ease-in-out infinite; }
    .particle:nth-child(10) { width:2px;  height:2px;  background:rgba(212,175,55,0.65); left:42%;  top:92%; animation: float-up 6.3s 1.7s ease-in-out infinite; }
    .particle:nth-child(11) { width:3px;  height:3px;  background:rgba(212,175,55,0.50); left:95%;  top:78%; animation: float-up 8.2s 0.2s ease-in-out infinite; }
    .particle:nth-child(12) { width:2px;  height:2px;  background:rgba(184,134,11,0.45); left:72%;  top:95%; animation: float-up 5.9s 2.6s ease-in-out infinite; }
    /* A few extra high-up specks for depth -->
    .particle:nth-child(13) { width:2px;  height:2px;  background:rgba(212,175,55,0.25); left:30%;  top:30%; animation: float-up 9.0s 3.0s ease-in-out infinite; }
    .particle:nth-child(14) { width:1px;  height:1px;  background:rgba(212,175,55,0.20); left:65%;  top:20%; animation: float-up 10s  4.0s ease-in-out infinite; }
    .particle:nth-child(15) { width:2px;  height:2px;  background:rgba(184,134,11,0.30); left:50%;  top:40%; animation: float-up 8.5s 1.5s ease-in-out infinite; }

    @keyframes float-up {
      0%   { transform: translateY(0)    translateX(0px);  opacity: 0; }
      10%  { opacity: 1; }
      80%  { opacity: 0.7; }
      100% { transform: translateY(-420px) translateX(18px); opacity: 0; }
    }

    /* ── Text block ── */
    .text-block {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      text-align: center;
      max-width: 860px;
      opacity: 0;
      will-change: opacity, transform;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 42px;
      line-height: 1.25;
      color: #F5F0E8;
      text-shadow:
        0 2px 30px rgba(0,0,0,0.8),
        0 0 60px rgba(0,0,0,0.5);
    }

    .headline em {
      font-style: italic;
      color: #D4AF37;
    }

    /* ── Bottom gold line ── */
    .gold-rule {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #B8860B, transparent);
      transform-origin: center;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="scene">

    <!-- Background shimmer -->
    <div class="bg-shimmer"></div>

    <!-- Particles (must be before watch so they render behind) -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <!-- Watch image -->
    <div class="watch-wrap">
      <img class="watch-img" src="../../public/watch-hero.webp" alt="Rolex watch"/>
    </div>

    <!-- Vignette overlay -->
    <div class="vignette"></div>

    <!-- Text -->
    <div class="text-block">
      <p class="headline">
        Descubra joias que transformam<br>
        brilho em <em>exclusividade.</em>
      </p>
    </div>

    <!-- Gold separator line -->
    <div class="gold-rule"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    window.__timelines["f03"] = tl;

    tl
      // Watch fades in from opacity 0 with slight upward drift
      .fromTo(".watch-img",
        { opacity: 0, y: 40, rotation: -5 },
        { opacity: 1, y: 0,  rotation: -5, duration: 1.4, ease: "power2.out" },
        0
      )

      // Text fades in at 0.5s
      .to(".text-block", {
        opacity: 1,
        y: 0,
        transformOrigin: "center bottom",
        duration: 0.9,
        ease: "power3.out"
      }, 0.5)

      // Gold rule sweeps in
      .to(".gold-rule", {
        scaleX: 1,
        duration: 0.8,
        ease: "power2.inOut"
      }, 0.7);
  </script>
</body>
</html>
