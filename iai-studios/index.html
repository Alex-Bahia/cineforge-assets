<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEFORGE AI - COCKPIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      #video-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        filter: brightness(1.05) contrast(1.05);
        transform: translateZ(0);
        will-change: transform, filter, opacity;
      }
      #root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      #root > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <!-- MOTOR DE VÍDEO NATIVO (ALTA PERFORMANCE) -->
    <video id="video-bg" autoplay playsinline muted preload="auto"></video>

    <div id="root"></div>

    <!-- SDK DO PUTER (SISTEMA NERVOSO DA IA) -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- PONTO DE ENTRADA DO REACT -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
